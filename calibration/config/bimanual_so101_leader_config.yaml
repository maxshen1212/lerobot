# Bimanual SO-101 Leader Calibration Config
# Usage: lerobot-calibrate --config_path calibration/config/bimanual_so101_leader_config.yaml
#
# NOTE: Calibrate leader arms separately from follower arms (script accepts only one at a time).
#
# Calibration writes TWO files (the top-level id is only a prefix, no id.json is created):
#   bimanual_so101_leader_left.json
#   bimanual_so101_leader_right.json

teleop:
  type: bi_so_leader
  id: bimanual_so101_leader # filename prefix for the per-arm calibration files
  calibration_dir: /home/max/Desktop/lerobot/calibration/bimanual_leader

  # Only `port` is used for leader arms; BiSOLeader ignores any other per-arm fields.
  left_arm_config:
    port: /dev/lerobot_leader_left

  right_arm_config:
    port: /dev/lerobot_leader_right
