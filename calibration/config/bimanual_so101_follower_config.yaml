# Bimanual SO-101 Follower Calibration Config
# Usage: lerobot-calibrate --config_path calibration/config/bimanual_so101_follower_config.yaml
#
# NOTE: robot and teleop cannot be calibrated in the same run (script accepts only one at a time).
#
# Calibration writes TWO files (the top-level id is only a prefix, no id.json is created):
#   bimanual_so101_follower_left.json
#   bimanual_so101_follower_right.json

robot:
  type: bi_so_follower
  id: bimanual_so101_follower # filename prefix for the per-arm calibration files
  calibration_dir: /home/air-420/Desktop/lerobot/calibration/bimanual_follower

  left_arm_config:
    port: /dev/lerobot_follower_left
    use_degrees: true # keep true for SO-101 policy compatibility
    disable_torque_on_disconnect: true
    max_relative_target: null # set a positive float (e.g. 5.0) to cap motor movement for safety

  right_arm_config:
    port: /dev/lerobot_follower_right
    use_degrees: true
    disable_torque_on_disconnect: true
    max_relative_target: null
